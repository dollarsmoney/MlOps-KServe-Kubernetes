[project]
name = "recommendation-mlops"
version = "0.1.0"
description = "Production-style short-video recommendation platform: two-stage retrieve-then-rank, served on Kubernetes with KServe."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"

# Python is pinned to 3.11 deliberately. The `kserve` Python SDK supports up to
# 3.12 only, and 3.11 is the version with the widest wheel coverage across
# torch / dvc / confluent-kafka. See docs/adr/0002-pin-python-311.md
dependencies = [
    # --- data ---
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "scipy>=1.13",

    # --- ml ---
    "torch>=2.4",
    "scikit-learn>=1.5",

    # --- pipeline & tracking ---
    "dvc[s3]>=3.51",
    "mlflow>=2.15",

    # --- serving ---
    "kserve>=0.13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",

    # --- infrastructure clients ---
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "confluent-kafka>=2.5",
    "boto3>=1.34",

    # --- observability ---
    "prometheus-client>=0.20",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "matplotlib>=3.9",       # distribution sanity plots for the generator
    "testcontainers>=4.8",   # integration tests against real postgres/redis/kafka
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ml*", "apps*"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, no external dependencies",
    "integration: requires postgres/redis/kafka/k8s",
    "slow: takes more than ~10s",
]
addopts = "-ra --strict-markers"
